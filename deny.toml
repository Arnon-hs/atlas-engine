# Dependency changes require review; see docs/security/dependency-policy.md.
[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = []

[licenses]
confidence-threshold = 0.93
include-dev = true
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = [
  { crate = "io-lifetimes@=2.0.4", reason = "fs-set-times 0.20.3 requires io-lifetimes 2; cap-primitives/cap-std/cap-fs-ext 4.0.3 require 3.0.1. Major APIs cannot be unified locally. Recheck on capability dependency updates; see dependency-policy.md." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
