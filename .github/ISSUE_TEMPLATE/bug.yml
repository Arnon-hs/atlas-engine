name: Bug report
description: A reproducible, non-sensitive defect in Atlas Engine.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include real secrets here. Follow
        [SECURITY.md](https://github.com/Arnon-hs/atlas-engine/blob/main/SECURITY.md).
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe to share publicly
      options:
        - label: This is not a vulnerability report, and all examples/logs are synthetic or safe to publish.
          required: true
  - type: input
    id: version
    attributes:
      label: Engine version and operating system
      description: Paste atlas-engine version and your OS/architecture.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Command, bounds, and a small public or synthetic input. No private source or absolute machine paths.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include schema/format and relevant sanitized diagnostics.
    validations:
      required: true
