name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    # Rust build-mode:none STILL runs build scripts/procedural macros. Keep this
    # job read-only, without secrets or OIDC, even for same-repository PRs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: false
          output: sarif-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results/*.sarif
          retention-days: 7
          if-no-files-found: error
      - name: Enforce documented SAST threshold
        run: python3 scripts/check_sast.py sarif-results

  upload:
    name: Publish trusted CodeQL results
    # A failing SAST threshold must not hide findings from the Security tab.
    if: always() && !cancelled() && github.repository == 'Arnon-hs/atlas-engine' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    # Download data from this run only. Do not check out or execute project code
    # in the job which receives a security-events write token.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codeql-*
          path: sarif-results
          merge-multiple: true
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: sarif-results
